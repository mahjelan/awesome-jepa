    <!-- Aggressive console filtering for ALL Edge deprecation warnings -->
    <script>
        (function () {
            // Override console methods with maximum suppression
            var originalWarn = console.warn;
            var originalLog = console.log;
            var originalInfo = console.info;

            function isDeprecationMessage(args) {
                var fullMessage = '';
                for (var i = 0; i < args.length; i++) {
                    if (args[i] && typeof args[i] === 'string') {
                        fullMessage += args[i] + ' ';
                    }
                }

                return fullMessage.includes('Deprecation') && fullMessage.includes('contrast') ||
                    fullMessage.includes('blogs.windows.com/msedgedev') ||
                    fullMessage.includes('Tracking Prevention blocked') ||
                    fullMessage.includes('blocked access to storage');
            }

            console.warn = function () {
                if (!isDeprecationMessage(arguments)) {
                    return originalWarn.apply(this, arguments);
                }
                // Completely silent for deprecation warnings
            };

            console.log = function () {
                if (!isDeprecationMessage(arguments)) {
                    return originalLog.apply(this, arguments);
                }
                // Completely silent for deprecation warnings
            };

            console.info = function () {
                if (!isDeprecationMessage(arguments)) {
                    return originalInfo.apply(this, arguments);
                }
                // Completely silent for deprecation warnings
            };

            // Also suppress at the global level
            window.addEventListener('error', function (e) {
                if (e.message && (e.message.includes('Deprecation') && e.message.includes('contrast') ||
                    e.message.includes('Tracking Prevention blocked'))) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            // Intercept any remaining console calls from deep in the system
            var originalConsole = window.console;
            Object.defineProperty(window, 'console', {
                get: function () {
                    return {
                        log: function () { if (!isDeprecationMessage(arguments)) originalConsole.log.apply(originalConsole, arguments); },
                        warn: function () { if (!isDeprecationMessage(arguments)) originalConsole.warn.apply(originalConsole, arguments); },
                        error: function () { if (!isDeprecationMessage(arguments)) originalConsole.error.apply(originalConsole, arguments); },
                        info: function () { if (!isDeprecationMessage(arguments)) originalConsole.info.apply(originalConsole, arguments); },
                        debug: function () { if (!isDeprecationMessage(arguments)) originalConsole.debug.apply(originalConsole, arguments); },
                        trace: originalConsole.trace.bind(originalConsole),
                        table: originalConsole.table.bind(originalConsole),
                        group: originalConsole.group.bind(originalConsole),
                        groupEnd: originalConsole.groupEnd.bind(originalConsole),
                        clear: originalConsole.clear.bind(originalConsole)
                    };
                },
                configurable: false
            });
        })();
    </script>
